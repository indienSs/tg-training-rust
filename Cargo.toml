[package]
name = "tg-training-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
env_logger = "0.11.11"
log = "0.4.35"
rusqlite = { version = "0.41.1", features = ["bundled"] }
teloxide = { version = "0.17.0", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "signal"] }

[profile.release]
strip = true
panic = "abort"
